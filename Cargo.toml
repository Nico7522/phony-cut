[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Debug builds: optimize dependencies (egui converts every video pixel; unoptimized it
# costs ~190 ms per 1080p frame) and lightly optimize our own code (per-frame loops),
# while keeping debug info and fast incremental builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Shipped build: smaller and faster executable.
[profile.release]
lto = "thin"
strip = true

[workspace.dependencies]
phonycut-core = { path = "crates/core" }
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
# Sound output (WASAPI on Windows, CoreAudio later on macOS).
cpal = "0.18.2"
thiserror = "2.0.21"
directories = "6.0.0"
eframe = "0.37.0"
ffmpeg-next = { version = "9.1.0", default-features = false, features = ["codec", "filter", "format", "software-scaling", "software-resampling"] }
# Native "choose a folder" dialog (Windows/macOS need no extra feature).
rfd = { version = "0.18.0", default-features = false }
# QR code for Wi-Fi pairing (drawn by egui: no image feature).
qrcode = { version = "0.15.0", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
