# Builds the website (website/, Astro) and deploys it to GitHub Pages:
#   https://nico7522.github.io/phony-cut/
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".

name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/tutorial/**"
      - "assets/icon/**"
      - "assets/demo.gif"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one, never a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      # Copies ../assets/tutorial, the logo and the demo, builds, then checks every internal link.
      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
