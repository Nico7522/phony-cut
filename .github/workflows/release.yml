# Builds the Windows installer and publishes it as a GitHub Release when a
# version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match the version in Cargo.toml ([workspace.package]).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # eframe 0.37 needs Rust >= 1.95; the runner image may lag behind.
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # LLVM (libclang for bindgen) and Inno Setup 6 are preinstalled on the
      # windows-latest image; .cargo/config.toml points LIBCLANG_PATH to LLVM.
      - name: FFmpeg (LGPL shared)
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Installer
        run: ./scripts/build-installer.ps1 -ExpectedVersion "${{ github.ref_name }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem target/installer -File |
            Where-Object { $_.Name -like 'PhoneCut-Setup-*.exe' -or $_.Name -eq 'SHA256SUMS.txt' } |
            ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @files `
            --title "PhoneCut ${{ github.ref_name }}" `
            --notes-file installer/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
