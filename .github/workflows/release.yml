# Builds the Windows installer and publishes it as a GitHub Release when a
# version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag must match the version in Cargo.toml ([workspace.package]).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # eframe 0.37 needs Rust >= 1.95; the runner image may lag behind.
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # LLVM (libclang for bindgen) and Inno Setup 6 are preinstalled on the
      # windows-latest image; .cargo/config.toml points LIBCLANG_PATH to LLVM.
      - name: FFmpeg (LGPL shared)
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Installer
        run: ./scripts/build-installer.ps1 -ExpectedVersion "${{ github.ref_name }}"

      # Creates the release, or updates it when the tag was moved to another
      # commit (the release already exists): files are replaced, notes and
      # title refreshed, so re-pushing a tag never fails.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem target/installer -File |
            Where-Object { $_.Name -eq 'PhoneCut-Setup-x64.exe' -or $_.Name -eq 'SHA256SUMS.txt' } |
            ForEach-Object { $_.FullName }
          if ($files.Count -ne 2) { Write-Error "Expected the installer and SHA256SUMS.txt, found: $files"; exit 1 }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists: replacing its files"
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "PhoneCut $tag" --notes-file installer/release-notes.md
          } else {
            gh release create $tag @files --title "PhoneCut $tag" --notes-file installer/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
