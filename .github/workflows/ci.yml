# Format, lint and tests on every push to main and every pull request.
# The tests use recorded streams (crates/core/tests/fixtures), never a phone.
# A task is not finished until this workflow is green (CLAUDE.md §7).

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", ".github/workflows/website.yml"]
  # No paths-ignore on pull requests: `check` is a required status check in the
  # main branch ruleset, so it must report on every PR (even website-only ones),
  # otherwise the PR stays blocked waiting for it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # eframe 0.37 needs Rust >= 1.95; the runner image may lag behind.
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # Avoids downloading ~200 MB on every run. The key follows the script, so
      # changing the pinned FFmpeg version in it refreshes the cache.
      # fetch-ffmpeg.ps1 then skips the download: vendor/ffmpeg is already the
      # pinned build (its BUILD.txt marker names the pinned archive).
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      # LLVM (libclang for bindgen) is preinstalled on the windows-latest image;
      # .cargo/config.toml points LIBCLANG_PATH to it.
      - name: FFmpeg (LGPL shared)
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # The file is generated from Cargo.lock and the pinned vendor versions:
      # after changing a dependency, rerun the script and commit the result.
      - name: THIRD_PARTY_LICENSES.md up to date
        run: |
          ./scripts/third-party-licenses.ps1
          git diff --exit-code -- THIRD_PARTY_LICENSES.md
          if ($LASTEXITCODE -ne 0) { Write-Error 'THIRD_PARTY_LICENSES.md is outdated: run scripts/third-party-licenses.ps1 and commit it'; exit 1 }
